<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoFound — Pitch Your Idea</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <div class="logo">CoFound</div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="invest.html">Invest</a>
      </nav>
    </div>
    <div class="nav-right">
      <a class="btn" href="index.html">Back</a>
    </div>
  </header>

  <main class="container narrow">
    <h1 class="page-title">Pitch Your Idea</h1>
    <p class="muted">Use this form to craft a concise investor-friendly pitch (this is a static mockup).</p>

    <div class="form-card">
      <label>Startup Name</label>
      <input class="input" placeholder="Aurora Energy">

      <label>Short Tagline</label>
      <input class="input" placeholder="P2P solar marketplaces">

      <label>One-line description</label>
      <textarea class="textarea" rows="4" placeholder="One sentence describing the product..."></textarea>

      <label>Funding required</label>
      <input class="input" placeholder="₹25,00,000">

      <label>Founder(s)</label>
      <input class="input" placeholder="Name(s) & short bio">

      <div class="form-actions">
        <a class="btn" href="explore.html">Submit (Mock)</a>
        <a class="btn ghost" href="index.html">Cancel</a>
      </div>
    </div>

  </main>

  <footer class="footer small">
    <a href="index.html" class="muted">← Back to home</a>
  </footer>
</body>
</html>
